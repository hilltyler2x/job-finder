name: Build phone apps

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Android test app
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CAP_SERVER_URL: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Check the site address
        run: |
          if [ -z "$CAP_SERVER_URL" ]; then
            echo "::warning::The repository variable APP_URL is not set, so this app will only show the \"couldn't connect\" page. Set APP_URL to the live site address (Settings > Secrets and variables > Actions > Variables) and run this again."
          else
            echo "The app will open $CAP_SERVER_URL"
          fi

      - run: npm ci

      - name: Copy settings into the Android project
        run: npx cap sync android

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publish to the test-build release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk JobFinder-test.apk
          if ! gh release view test-build >/dev/null 2>&1; then
            gh release create test-build --prerelease --target "$GITHUB_SHA" \
              --title "Test build" \
              --notes "Latest Android test app. On your phone, download JobFinder-test.apk and open it to install."
          fi
          gh release upload test-build JobFinder-test.apk --clobber
          echo "Download: https://github.com/${GITHUB_REPOSITORY}/releases/download/test-build/JobFinder-test.apk" >> "$GITHUB_STEP_SUMMARY"

  play:
    name: Android app for Google Play
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CAP_SERVER_URL: ${{ vars.APP_URL }}
    steps:
      - name: Check the upload key
        id: check
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::notice::Skipping the Google Play build: the ANDROID_KEYSTORE_BASE64 secret isn't set."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        if: steps.check.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        if: steps.check.outputs.ready == 'true'
        run: npm ci

      - name: Copy settings into the Android project
        if: steps.check.outputs.ready == 'true'
        run: npx cap sync android

      - name: Build the signed app bundle
        if: steps.check.outputs.ready == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/upload.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_PATH"
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon
          rm -f "$ANDROID_KEYSTORE_PATH"

      - name: Publish to the play-build release
        if: steps.check.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/bundle/release/app-release.aab JobFinder-play.aab
          if ! gh release view play-build >/dev/null 2>&1; then
            gh release create play-build --prerelease --target "$GITHUB_SHA" \
              --title "Google Play build" \
              --notes "Latest signed Android app bundle. Upload JobFinder-play.aab in Google Play Console."
          fi
          gh release upload play-build JobFinder-play.aab --clobber
          echo "Download: https://github.com/${GITHUB_REPOSITORY}/releases/download/play-build/JobFinder-play.aab (version code ${{ github.run_number }})" >> "$GITHUB_STEP_SUMMARY"

  ios:
    name: iPhone app (TestFlight)
    runs-on: macos-26
    env:
      CAP_SERVER_URL: ${{ vars.APP_URL }}
    steps:
      - name: Check Apple secrets
        id: check
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=""
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::notice::Skipping the iPhone build. Missing repository secrets:$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -z "$CAP_SERVER_URL" ]; then
            echo "::warning::The repository variable APP_URL is not set, so this app will only show the \"couldn't connect\" page."
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: steps.check.outputs.ready == 'true'
        run: npm ci

      - name: Copy settings into the iOS project
        if: steps.check.outputs.ready == 'true'
        run: npx cap sync ios

      - name: Write the App Store Connect key
        if: steps.check.outputs.ready == 'true'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$key_path"
          chmod 600 "$key_path"
          echo "ASC_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Set the build number
        if: steps.check.outputs.ready == 'true'
        working-directory: ios/App
        run: /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" App/Info.plist

      - name: Archive
        if: steps.check.outputs.ready == 'true'
        working-directory: ios/App
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild archive \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic

      - name: Upload to TestFlight
        if: steps.check.outputs.ready == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Remove the key
        if: always() && steps.check.outputs.ready == 'true'
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
