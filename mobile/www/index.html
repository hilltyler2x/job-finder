<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Job Finder</title>
  <style>
    :root { color-scheme: light dark; --bg: #f5f7fb; --fg: #1a1f2b; --muted: #5b6475; --blue: #2456d6; }
    @media (prefers-color-scheme: dark) { :root { --bg: #11151d; --fg: #eef1f7; --muted: #a3acbd; } }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg); color: var(--fg);
      font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center; text-align: center;
      padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
      box-sizing: border-box;
    }
    main { max-width: 340px; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { color: var(--muted); margin: 0 0 24px; }
    button {
      background: var(--blue); color: #fff; border: 0; border-radius: 12px;
      font: inherit; font-weight: 600; padding: 12px 28px; cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <h1>Couldn't connect</h1>
    <p>Job Finder needs an internet connection. Check your connection and try again.</p>
    <button id="retry" type="button">Try again</button>
  </main>
  <script src="app-url.js"></script>
  <script>
    document.getElementById("retry").addEventListener("click", function () {
      var target = window.APP_URL;
      // On Android this page is shown at the site's own address, so its origin works too.
      if (!target && /^https?:$/.test(location.protocol) && location.hostname !== "localhost") {
        target = location.origin + "/";
      }
      if (target) location.href = target;
      else location.reload();
    });
  </script>
</body>
</html>
